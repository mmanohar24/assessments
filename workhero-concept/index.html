/* Chart. Labels are real HTML, so they keep their size at every width. */
.chart-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.25rem min(1rem, 4vw) .875rem; box-shadow: var(--shadow); }

.agent-btn {

dialog { color: var(--ink); overscroll-behavior: contain; }

.avatar.small { width: 1.875rem; height: 1.875rem; font-size: .8125rem; }

.day-head { font: 600 .875rem/1.3 var(--body); color: var(--muted); text-align: center; margin-block: 1.25rem .75rem; }
.msgs { display: grid; grid-template-columns: minmax(0, 1fr); gap: .375rem; }
.msg { display: flex; align-items: flex-end; gap: .5rem; max-width: 100%; }
.msg .spacer { flex: none; width: 1.875rem; }
.bub { padding: .625rem .875rem; border-radius: 22px; max-width: min(84%, 25rem); min-width: 0; background: var(--card); border: 1px solid var(--line); font-size: 1rem; line-height: 1.4; }

/* Confirmation */
.confirm { padding-block: clamp(2rem, 7vh, 4.5rem) 2rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
.confirm-top { display: grid; gap: 1.125rem; justify-items: start; }

.rows { padding-block: .5rem; }
.row { padding-block: 1rem; }

.steps li::before { content: counter(s); width: 1.625rem; height: 1.625rem; border-radius: 50%; background: var(--tint); color: var(--tint-ink); font-weight: 600; font-size: .875rem; display: grid; place-items: center; }
.undo { padding-block: .875rem; overflow: hidden; position: relative; }

.confirm-links { display: grid; gap: .625rem; }

/* Footer: the padding keeps the avatar off this text. */
.foot { padding-block: 2.25rem calc(6.5rem + var(--safe-b)); color: var(--muted); font-size: .875rem; text-align: center; }

@media (min-width: 47.5em) {

  .hero-sub { font-size: 1.25rem; }
  .sect { padding-top: 3.5rem; }
  .chart-card { padding: 1.5rem 1.375rem .875rem; }
  .plot { height: 15rem; }
  /* Side panel on larger screens */
  #sheet { inset: 0 0 0 auto; width: min(30rem, 100vw); border-radius: 28px 0 0 28px; }
  #agent-live { left: auto; width: min(21.25rem, calc(100vw - 2.5rem)); }
}
/* Short phones: a tighter bubble keeps it off the hero line. */
@media (max-height: 40em) {
  .agent-note { padding: .625rem .875rem; }
  .agent-from { margin-bottom: 0; }
  .agent-actions { margin-top: .375rem; }
  .agent-actions .btn { padding-block: .375rem; }
}
/* Phone on its side: the bubble sits beside the avatar, the hero gives up some height. */
@media (max-height: 30em) {
  h1 { font-size: clamp(2.125rem, 6.4vw, 2.75rem); }
  .hero { padding-block: 1.25rem 1.25rem; }
  .hero-sub { margin-top: .75rem; }
  #agent-live { bottom: max(.75rem, var(--safe-b)); right: calc(max(.75rem, env(safe-area-inset-right)) + var(--avatar) + .75rem); left: max(.75rem, env(safe-area-inset-left)); width: auto; }
  .agent-note { padding: .625rem .875rem; max-height: calc(100dvh - 5rem); }
  .agent-from { margin-bottom: 0; }
  .agent-actions { margin-top: .375rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .undo-meter { display: none; }
}
@media (forced-colors: active) {
  .plot .line { stroke: CanvasText; }
  .status-dot, .dot { background: CanvasText; }
}
</style>
</head>

<dialog id="sheet" aria-labelledby="sheet-title"></dialog>

<script>
/* The one source of truth. Every screen reads from here or from derive() below. All sample data. */
const DATA = {
  owner: { first: 'Luis' },
  manager: { first: 'Dana', last: 'Reed', initial: 'D' },
  week: { start: '2026-10-26', end: '2026-11-01' },
  // Six weeks ending with the week above, so the last entry is the displayed week.
  cash: [
    { start: '2026-09-21', invoiced: 14200, collected: 11800 },
    { start: '2026-09-28', invoiced: 16400, collected: 12900 },
    { start: '2026-10-05', invoiced: 15100, collected: 13600 },
    { start: '2026-10-12', invoiced: 17800, collected: 13900 },
    { start: '2026-10-19', invoiced: 16900, collected: 14700 },
    { start: '2026-10-26', invoiced: 18600, collected: 15200 },
  ],

  ],
  // The week's work. "n" adds up to the count in the hero.
  work: [
    { id: 'inv-mon', day: '2026-10-26', type: 'invoicing', n: 4, done: '{n} invoices sent, tracked in Housecall Pro', text: '{n} invoices from last week’s jobs went out this morning. All tracked in Housecall Pro.' },
    { id: 'permit-mon', day: '2026-10-26', type: 'permits', n: 1, done: 'Filed for the Marsh install', text: 'Filed the permit for the Marsh install. It’s on your schedule.' },
    { id: 'rebates-wed', day: '2026-10-28', type: 'rebates', n: 2, done: '{n} heat pump rebates sent to the utility', text: '{n} heat pump rebates went to the utility today. Now we wait on them.' },
    { id: 'reg-wed', day: '2026-10-28', type: 'registrations', n: 2, done: '{n} installs registered for warranty', text: 'Registered the equipment on {n} installs, so the warranties are set.' },
    { id: 'permit-wed', day: '2026-10-28', type: 'permits', n: 1, done: 'Filed for the Okafor job', text: 'Filed the Okafor permit too. Nothing you need to do.' },
    { id: 'inv-fri', day: '2026-10-30', type: 'invoicing', n: 2, done: '{n} more invoices sent. {invoices} for the week.', text: 'Last {n} invoices are out. That’s {invoices} for the week.' },
    { id: 'ar-fri', day: '2026-10-30', type: 'ar', n: 1, done: '5 old invoices fixed in QuickBooks', text: 'Cleaned up your A/R. 5 old invoices showed unpaid, but they had been paid. Fixed in QuickBooks.' },
    { id: 'exp-fri', day: '2026-10-30', type: 'expenses', n: 1, done: 'Card charges matched to jobs in QuickBooks', text: 'Matched this week’s card charges to jobs in QuickBooks. All lined up.' },
  ],
  // Card wording is relative on purpose: nothing here can read as a date already gone by.
  // The one date is the install, a past fact the owner is asked to confirm.
  needs: [
    {
      id: 'rebate',

      text: 'Ready to submit. It needs your okay on the address and install date.',
      facts: [['Job address', '418 Alder Lane'], ['Install date', 'Oct 22, 2026', 'past-fact']],
      approved: 'Your okay on the job address (418 Alder Lane) and install date (Oct 22, 2026) for the Hollis rebate form.',
      next: ['Dana submits the form to the utility today.', 'The utility reviews it. Dana tracks it and follows up.'],

    },
    {
      id: 'reminder',
      title: 'Overdue payment reminder',
      text: 'Ready to send on an overdue invoice. It needs your okay on the tone and timing.',
      facts: [['Invoice', 'Greer, #1047, 18 days overdue'], ['Tone', 'Friendly and short'], ['Timing', 'Goes out tomorrow at 9 AM']],
      approved: 'Your okay on a friendly, short reminder to the Greer household about invoice #1047. It goes out tomorrow at 9 AM.',
      next: ['The reminder goes to the customer tomorrow at 9 AM.', 'Dana watches for a reply and follows up.'],
      hearBack: 'Dana will text you within 2 days with where it stands.',
    },
  ],
  thread: [
    { day: '2026-10-26', items: [
      { from: 'dana', time: '8:12 AM', text: 'Morning, {owner}. I’ll text you here when something needs your yes.' },
      { from: 'dana', work: 'inv-mon' },
      { from: 'dana', work: 'permit-mon' },
      { from: 'owner', time: '12:05 PM', text: 'Thanks Dana' },
    ]},
    { day: '2026-10-28', items: [
      { from: 'dana', time: '9:30 AM', work: 'rebates-wed' },
      { from: 'dana', work: 'reg-wed' },
      { from: 'dana', work: 'permit-wed' },
    ]},
    { day: '2026-10-30', items: [
      { from: 'dana', time: '3:05 PM', work: 'inv-fri' },
      { from: 'dana', work: 'ar-fri' },
      { from: 'dana', work: 'exp-fri' },
      { from: 'owner', time: '5:40 PM', text: 'Good stuff. Have a good weekend' },
    ]},
    { label: 'This morning', items: [
      { from: 'dana', time: '7:45 AM', text: 'Morning, {owner}. Last week: {handled} things done and {collected} collected.' },
      { from: 'dana', text: '{needCount} things need your yes before I can move. About a minute, tops.' },
      { card: 'rebate' },
      { card: 'reminder' },
      { from: 'dana', text: 'Not sure on either one? Tap “Ask Dana to call” and I’ll call you.' },
    ]},
  ],
  provenance: 'Drafted with AI. Checked by Dana.',
  callNote: 'Dana will call you today.',
  why: [
    'The big picture comes first, and detail opens only when it’s wanted.',
    'A yes belongs inside the conversation, next to the reason.',
    'Plain words respect an owner reading between jobs.',
  ],
  bubble: {
    nudge: k => `${k} ${k === 1 ? 'thing needs' : 'things need'} your okay. Everything else is handled.`,
    caught: 'All caught up. Keep it that way.',
    delayMs: 2000,
    lifeMs: 8000,
    hideAfterScroll: 260,
  },
  chart: { lo: 0, hi: 20000, ticks: [20000, 10000, 0], padX: 4 },
  undoSeconds: 20,
};

const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const dayFmt = (iso, opts) => new Intl.DateTimeFormat('en-US', { timeZone: 'UTC', ...opts }).format(new Date(iso + 'T12:00:00Z'));
const shortDate = iso => dayFmt(iso, { month: 'short', day: 'numeric' });
const weekRange = iso => {
  const end = new Date(Date.parse(iso + 'T12:00:00Z') + 6 * 864e5).toISOString().slice(0, 10);
  return `${shortDate(iso)} to ${shortDate(end)}`;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (list, key) => list.reduce((t, x) => t + x[key], 0);
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem(k, v); } catch {} },
  del(k) { try { sessionStorage.removeItem(k); } catch {} },
};

/* Spring curves sampled into CSS linear(), with a plain fallback for older browsers. */
function spring(damping, freq, fallback) {
  if (!CSS.supports('animation-timing-function', 'linear(0, 1)')) return fallback;
  const pts = [];
  for (let i = 0; i <= 28; i++) {
    const t = i / 28 * 1.2;
    pts.push((1 - Math.exp(-damping * t) * (Math.cos(freq * t) + damping / freq * Math.sin(freq * t))).toFixed(3));
  }
  pts[pts.length - 1] = '1';
  return `linear(${pts.join(',')})`;
}
const SPRING_POP = spring(7, 13, 'cubic-bezier(.3,1.4,.5,1)');
const SPRING_SHEET = spring(9, 8, 'cubic-bezier(.2,.9,.25,1)');
document.documentElement.style.setProperty('--spring', SPRING_POP);

const state = {
  approved: {},      // id -> { until: timestamp, from: route }
  calls: {},         // id -> true once the owner asked Dana to call
  first: true,
  focusItem: null,
  undoneFocus: null,
  nudgeDone: false,
  later: store.get('wh-later') === '1',
  caughtShown: false,
};

/* Everything shown as a count or total comes from here, so screens can't disagree. */
function derive() {
  const open = DATA.needs.filter(n => !state.approved[n.id]);
  const byType = id => sum(DATA.work.filter(w => w.type === id), 'n');
  const first = DATA.cash[0];
  const latest = DATA.cash[DATA.cash.length - 1];
  return {
    open, byType, first, latest,
    handled: sum(DATA.work, 'n'),
    invoices: byType('invoicing'),
    rebatesInProgress: byType('rebates') + 1,
    growth: Math.round((latest.collected / first.collected - 1) * 100),
  };
}
function fill(text, n) {
  const d = derive();
  return text
    .replace('{n}', n)
    .replace('{owner}', DATA.owner.first)
    .replace('{invoices}', d.invoices)
    .replace('{handled}', d.handled)
    .replace('{collected}', money.format(d.latest.collected))
    .replace('{needCount}', DATA.needs.length);
}
const needLine = k => k === 0 ? 'All caught up.' : `${k} need${k === 1 ? 's' : ''} you. The rest is handled.`;

const ICON_DOWN = '<svg class="chev" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="m4 7 5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- Chart ---------- */
const ptX = i => DATA.chart.padX + i * (100 - 2 * DATA.chart.padX) / (DATA.cash.length - 1);
const ptY = v => 100 - (v - DATA.chart.lo) / (DATA.chart.hi - DATA.chart.lo) * 100;
function chartHTML() {
  const d = derive();
  const coords = DATA.cash.map((w, i) => `${ptX(i).toFixed(2)},${ptY(w.collected).toFixed(2)}`);
  const line = 'M' + coords.join(' L');
  const area = `${line} L${ptX(DATA.cash.length - 1).toFixed(2)},100 L${ptX(0).toFixed(2)},100 Z`;
  const last = DATA.cash.length - 1;
  const alt = `Line chart of weekly cash collected, rising every week from ${money.format(d.first.collected)} in the week of ${shortDate(d.first.start)} to ${money.format(d.latest.collected)} in the week of ${shortDate(d.latest.start)}. The axis starts at zero and runs to ${money.format(DATA.chart.hi)}.`;
  const axis = v => v ? `$${v / 1000}k` : '$0';
  const rows = DATA.cash.map(w => `<tr><th scope="row">${weekRange(w.start)}</th><td>${money.format(w.invoiced)}</td><td>${money.format(w.collected)}</td></tr>`).join('');
  return `<div class="chart-card">
    <div role="img" aria-label="${esc(alt)}">
      <div class="plot" id="plot" data-lo="${DATA.chart.lo}" data-hi="${DATA.chart.hi}">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs><linearGradient id="area-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" class="grad-top"/><stop offset="1" class="grad-end"/></linearGradient></defs>
          <path d="${area}" fill="url(#area-fill)"/>
          <path class="line" d="${line}"/>
        </svg>
        <span class="draw-cover" aria-hidden="true"></span>
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          ${DATA.chart.ticks.map(v => `<line class="grid" x1="0" x2="100" y1="${ptY(v)}" y2="${ptY(v)}"/>`).join('')}
        </svg>
        ${DATA.chart.ticks.map(v => `<span class="tick" data-value="${v}" style="top:${ptY(v)}%">${axis(v)}</span>`).join('')}
        ${DATA.cash.map((w, i) => `<span class="pt${i === last ? ' last' : ''}" data-value="${w.collected}" style="left:${ptX(i).toFixed(2)}%;top:${ptY(w.collected).toFixed(2)}%"></span>`).join('')}
        <div class="x-labels">${DATA.cash.map((w, i) => `<span class="x-lab" style="left:${ptX(i).toFixed(2)}%">${shortDate(w.start)}</span>`).join('')}</div>
      </div>
    </div>
    <details class="tbl">
      <summary><span>See the numbers as a table</span>${ICON_DOWN}</summary>
      <div class="tbl-box" tabindex="0" role="region" aria-label="Weekly cash table">
        <table>
          <caption>Cash invoiced and collected, by week. Sample data.</caption>
          <thead><tr><th scope="col">Week</th><th scope="col">Invoiced</th><th scope="col">Collected</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </details>
  </div>`;
}
/* Show as many week labels as fit: all six, else first, middle and last, else the two ends. */
function fitXLabels() {
  const plot = document.getElementById('plot');
  if (!plot) return;
  const labs = [...plot.querySelectorAll('.x-lab')];
  const width = plot.offsetWidth;
  const w = Math.max(...labs.map(l => l.offsetWidth));
  // When a centered end label would poke past the card, line it up with its point instead.
  const tight = w / 2 > width * DATA.chart.padX / 100 + 12;
  plot.classList.toggle('tight', tight);
  const n = labs.length - 1;
  const em = parseFloat(getComputedStyle(labs[0]).fontSize);
  const x = i => ptX(i) / 100 * width;
  const leftOf = i => tight && i === 0 ? x(i) - em : tight && i === n ? x(i) + em - w : x(i) - w / 2;
  const rightOf = i => leftOf(i) + w;
  const fits = set => set.every((i, j) => !j || leftOf(i) - rightOf(set[j - 1]) >= 8);
  const show = [[...labs.keys()], [0, Math.floor(n / 2), n], [0, n]].find(fits) || [0, n];
  labs.forEach((l, i) => l.classList.toggle('off', !show.includes(i)));
}
const plotWatch = 'ResizeObserver' in window ? new ResizeObserver(fitXLabels) : null;

/* ---------- Needs-you cards ---------- */
function needCard(n, where) {
  const H = where === 'sheet' ? 'h3' : 'h2';
  const cls = where === 'sheet' ? 'card need msg-card' : 'card need';
  const name = esc(n.title.toLowerCase());
  if (state.approved[n.id]) {
    return `<article class="${cls}" data-card="${n.id}">
      <span class="tag done"><span class="dot okay" aria-hidden="true"></span>Approved</span>
      <${H} class="need-title">${esc(n.title)}</${H}>
      <p class="need-text">${esc(n.hearBack)}</p>
      <div class="actions"><a class="btn soft" href="#/approved/${n.id}" aria-label="See what’s next for the ${name}">See what’s next</a></div>
    </article>`;
  }
  return `<article class="${cls}" data-card="${n.id}">
    <span class="tag"><span class="dot" aria-hidden="true"></span>Needs you</span>
    <${H} class="need-title">${esc(n.title)}</${H}>
    <p class="need-text">${esc(n.text)}</p>
    <dl class="facts">${n.facts.map(([k, v, kind]) => `<dt>${esc(k)}</dt><dd${kind ? ` data-${kind}` : ''}>${esc(v)}</dd>`).join('')}</dl>
    <div class="actions">
      <button type="button" class="btn" data-approve="${n.id}" aria-label="Approve ${name}">Approve</button>
      ${state.calls[n.id]
        ? `<p class="call-note">${esc(DATA.callNote)}</p>`
        : `<button type="button" class="link" data-call="${n.id}" aria-label="Ask Dana to call about the ${name}">Ask Dana to call</button>`}
    </div>
  </article>`;
}

/* ---------- Dashboard ---------- */
function renderWeek() {
  const d = derive();
  const k = d.open.length;
  const days = [...new Set(DATA.work.map(w => w.day))];
  const timeline = days.map(iso => {
    const items = DATA.work.filter(w => w.day === iso);
    return `<details class="day">
      <summary><span>${esc(dayFmt(iso, { weekday: 'long', month: 'short', day: 'numeric' }))}</span><span class="day-count">${sum(items, 'n')} things</span>${ICON_DOWN}</summary>
      <ul>${items.map(w => `<li data-n="${w.n}" data-type="${w.type}"><b>${esc(DATA.workTypes.find(t => t.id === w.type).label)}</b> ${esc(fill(w.done, w.n))}</li>`).join('')}</ul>
    </details>`;
  }).join('');
  return `<div class="screen${state.first ? ' first' : ' soft-in'}">
    <div class="wrap">
      <section class="hero">
        <p class="eyebrow rise" id="eyebrow"><span translate="no">Your week with WorkHero</span> · Sample week: ${shortDate(DATA.week.start)} to ${shortDate(DATA.week.end)}, 2026</p>
        <h1 class="rise" style="--d:1" tabindex="-1" id="headline" aria-label="Your office manager handled ${d.handled} things this week.">Your office manager handled <em class="i"><span class="num" id="count">${d.handled}</span>&nbsp;things</em> this&nbsp;week.</h1>
        <p class="hero-sub rise" style="--d:2"><span class="dot${k ? '' : ' okay'}" aria-hidden="true"></span><span id="subline">${needLine(k)}</span></p>
      </section>
      <section class="needs rise" style="--d:3" id="needs" aria-label="Needs you">${DATA.needs.map(n => needCard(n, 'dash')).join('')}</section>
      <p class="note" id="provenance">${esc(DATA.provenance)}</p>
      <dl class="nums">
        <div class="num-item"><dt>Invoiced</dt><dd id="stat-invoiced">${money.format(d.latest.invoiced)}</dd></div>
        <div class="num-item"><dt>Collected</dt><dd id="stat-collected">${money.format(d.latest.collected)}</dd></div>
        <div class="num-item"><dt>Rebates in progress</dt><dd id="stat-rebates">${d.rebatesInProgress}</dd></div>
      </dl>
      <section class="sect" aria-labelledby="chart-title">
        <h2 class="dsp" id="chart-title">Cash collected is <em class="i">up&nbsp;${d.growth}%</em> in six weeks.</h2>
        <p class="sub" id="chart-summary">From ${money.format(d.first.collected)} to ${money.format(d.latest.collected)} a week. The chart starts at zero.</p>
        ${chartHTML()}
      </section>
      <section class="sect" aria-labelledby="did-title">
        <h2 class="dsp" id="did-title">What <span translate="no">WorkHero</span> <em class="i">did this week.</em></h2>
        <p class="sub"><span id="did-count">${d.handled}</span> things, all handled.</p>
        <div class="days">${timeline}</div>
      </section>
      <aside class="why" aria-labelledby="why-title">
        <h2 class="dsp" id="why-title">Why I designed it <em class="i">this way.</em></h2>
        <ul id="why-list">${DATA.why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
      </aside>
    </div>
  </div>`;
}

/* ---------- Update thread (inside the sheet) ---------- */
function bubble(m, showAvatar) {
  const who = m.from === 'dana' ? DATA.manager.first : 'You';
  const time = m.time ? `<p class="time ${m.from === 'owner' ? 'owner' : ''}">${esc(m.time)}</p>` : '';
  const face = m.from === 'dana'
    ? (showAvatar ? `<span class="avatar small" aria-hidden="true">${DATA.manager.initial}</span>` : '<span class="spacer"></span>')
    : '';
  return `<li>${time}<div class="msg ${m.from}">${face}<p class="bub"><span class="sr-only">${who}: </span>${esc(m.text)}</p></div></li>`;
}
function renderThread() {
  const d = derive();
  const days = DATA.thread.map(group => {
    const label = group.label || dayFmt(group.day, { weekday: 'long', month: 'short', day: 'numeric' });
    const msgs = group.items.map((it, i) => {
      if (it.card) return `<li>${needCard(DATA.needs.find(n => n.id === it.card), 'sheet')}</li>`;
      const w = it.work && DATA.work.find(x => x.id === it.work);
      const raw = w ? fill(w.text, w.n) : fill(it.text);
      const next = group.items[i + 1];
      const lastOfRun = !next || next.from !== it.from;
      return bubble({ from: it.from, time: it.time, text: raw }, lastOfRun);
    }).join('');
    return `<section aria-label="${esc(label)}">
      <h3 class="day-head">${esc(label)}</h3>
      <ul class="msgs">${msgs}</ul>
    </section>`;
  }).join('');
  return `<div class="sheet-head">
      <div class="sheet-who">
        <span class="avatar" aria-hidden="true">${DATA.manager.initial}</span>
        <div class="sheet-name">
          <h2 id="sheet-title" tabindex="-1">Update from <em class="i">${esc(DATA.manager.first)}</em></h2>
          <p>Your office manager</p>
        </div>
        <button type="button" class="btn soft sheet-close" id="sheet-close">Close</button>
      </div>
      <div class="sheet-meta">
        <span class="pill">Sample data</span>
        ${d.open.length ? `<button type="button" class="link" data-jump-card="${d.open[0].id}">See what needs you (${d.open.length})</button>` : '<span class="note" style="margin:0">Nothing needs you right now</span>'}
      </div>
    </div>
    <div class="sheet-body" id="sheet-body" tabindex="-1">${days}</div>`;
}

/* ---------- Confirmation ---------- */
function undoHTML(id) {
  const a = state.approved[id];
  const left = Math.ceil((a.until - Date.now()) / 1000);
  if (left > 0) {
    return `<div class="card undo" id="undo">
      <div class="undo-row">
        <p class="undo-note">Changed your mind? You can undo for a few seconds.</p>
        <button type="button" class="btn soft" data-undo="${id}">Undo <span id="undo-left" aria-hidden="true">${left}s</span></button>
      </div>
      <span class="undo-meter" style="animation-duration:${a.until - Date.now()}ms" aria-hidden="true"></span>
    </div>`;
  }
  return `<div class="card undo" id="undo"><p>It’s locked in. Need a change? ${esc(DATA.manager.first)} is one text away.</p></div>`;
}
function renderApproved(id) {
  const n = DATA.needs.find(x => x.id === id);
  const nextUp = derive().open[0];
  return `<div class="screen soft-in wrap narrow confirm">
    <div class="confirm-top">
      <span class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m5 12.5 4.6 4.6L19 7.6" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <h1 tabindex="-1">Approved. <em class="i">${esc(DATA.manager.first)} has it.</em></h1>
    </div>
    <div class="card rows" id="confirm-card">
      <section class="row"><h2>What you approved</h2><p>${esc(n.approved)}</p></section>
      <section class="row"><h2>What happens next</h2><ol class="steps">${n.next.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol></section>
      <section class="row"><h2>When you’ll hear back</h2><p>${esc(n.hearBack)}</p></section>
    </div>
    <div id="undo-slot">${undoHTML(id)}</div>
    <div class="confirm-links">
      ${nextUp
        ? `<a class="btn wide" href="#/update" data-focus-item="${nextUp.id}">Next: ${esc(nextUp.title.toLowerCase())}</a><a class="btn soft wide" href="#/">Back to your week</a>`
        : `<a class="btn wide" href="#/">Back to your week</a><a class="btn soft wide" href="#/update">Back to the update</a>`}
    </div>
  </div>`;
}

/* ---------- Floating Dana ---------- */
const main = document.getElementById('main');
const live = document.getElementById('live');
const agent = document.getElementById('agent');
const agentBtn = document.getElementById('agent-btn');
const agentLive = document.getElementById('agent-live');
const sheet = document.getElementById('sheet');
document.getElementById('agent-face').textContent = DATA.manager.initial;
let bubbleTimer = null;

function announce(msg) {
  live.textContent = '';
  setTimeout(() => { live.textContent = msg; }, 60);
}
function updateAgentBtn() {
  const k = derive().open.length;
  const who = `${DATA.manager.first}, your office manager.`;
  agentBtn.setAttribute('aria-label', k ? `${who} ${DATA.bubble.nudge(k)} Open the update.` : `${who} ${DATA.bubble.caught} Open the update.`);
  document.getElementById('agent-dot').classList.toggle('calm', !k);
}
function noteEl() { return agentLive.querySelector('.agent-note'); }
function armBubbleTimer() {
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => {
    // Never yank the bubble out from under someone who has tabbed into it.
    if (noteEl()?.contains(document.activeElement)) return armBubbleTimer();
    hideBubble();
  }, DATA.bubble.lifeMs);
}
function showBubble(kind) {
  if (sheet.open || agent.hidden || noteEl()) return;
  const k = derive().open.length;
  const text = kind === 'nudge' ? DATA.bubble.nudge(k) : DATA.bubble.caught;
  const actions = kind === 'nudge'
    ? `<div class="agent-actions"><button type="button" class="btn" id="bubble-review">Review</button><button type="button" class="btn soft" id="bubble-later">Later</button></div>`
    : '';
  agentLive.innerHTML = `<div class="agent-note" data-kind="${kind}">
    <p class="agent-from">${esc(DATA.manager.first)}, your office manager</p>
    <p class="agent-text">${esc(text)}</p>
    ${actions}
  </div>`;
  if (!reduced()) {
    noteEl().animate(
      [{ opacity: 0, transform: 'translateY(20px) scale(.92)' }, { opacity: 1, transform: 'none' }],
      { duration: 640, easing: SPRING_POP }
    );
  }
  armBubbleTimer();
}
function hideBubble(animated = true) {
  clearTimeout(bubbleTimer);
  const el = noteEl();
  if (!el) return;
  const hadFocus = el.contains(document.activeElement);
  const remove = () => {
    if (noteEl() === el) agentLive.innerHTML = '';
    if (hadFocus && !agent.hidden && !sheet.open) agentBtn.focus();
  };
  if (!animated || reduced()) return remove();
  el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(10px) scale(.97)' }], { duration: 160, easing: 'ease-in', fill: 'forwards' }).onfinish = remove;
}

/* ---------- Sheet ---------- */
function openSheet() {
  hideBubble(false);
  state.nudgeDone = true;
  sheet.innerHTML = renderThread();
  if (sheet.open) return;
  document.documentElement.classList.add('sheet-open');
  sheet.showModal();
  if (!reduced()) {
    const wide = matchMedia('(min-width: 47.5em)').matches;
    sheet.animate({ transform: [wide ? 'translateX(100%)' : 'translateY(100%)', 'none'] }, { duration: 560, easing: SPRING_SHEET });
    sheet.animate({ opacity: [0, 1] }, { duration: 260, easing: 'linear', pseudoElement: '::backdrop' });
  }
  document.getElementById('sheet-close').focus();
}
function closeSheet({ instant = false, returnFocus = true } = {}) {
  if (!sheet.open) return;
  const finish = () => {
    ownClose = true;
    if (sheet.open) sheet.close();
    document.documentElement.classList.remove('sheet-open');
    if (returnFocus) agentBtn.focus();
  };
  if (instant || reduced()) return finish();
  const wide = matchMedia('(min-width: 47.5em)').matches;
  sheet.animate({ opacity: [1, 0] }, { duration: 220, easing: 'linear', pseudoElement: '::backdrop', fill: 'forwards' });
  sheet.animate({ transform: ['none', wide ? 'translateX(100%)' : 'translateY(100%)'] }, { duration: 260, easing: 'cubic-bezier(.4,0,.8,.4)', fill: 'forwards' })
    .onfinish = () => { finish(); sheet.getAnimations({ subtree: true }).forEach(a => a.cancel()); };
}
function leaveSheet() {
  // Go back if the sheet was opened from the dashboard; otherwise (deep link, or back from a confirmation) land on it.
  if (cameFromWeek) history.back(); else location.replace('#/');
}

/* ---------- Router ---------- */
let ownClose = false, route = null, mainView = null, dirty = false, weekScroll = 0, tick = null, cameFromWeek = false;

function parse() {
  const h = location.hash;
  if (h === '#/update') return { name: 'update', key: h };
  const m = h.match(/^#\/approved\/(\w+)$/);
  if (m) return { name: 'approved', id: m[1], key: h };
  return { name: 'week', key: '#/' };
}
function runCountUp() {
  const el = document.getElementById('count');
  const target = derive().handled;
  if (!el || reduced()) return;
  const start = performance.now() + 320, dur = 1000;
  el.textContent = '0';
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function render() {
  clearInterval(tick);
  const r = parse();
  // A confirmation only exists after an approval; a stale link lands on the thread instead.
  if (r.name === 'approved' && !state.approved[r.id]) { location.replace('#/update'); return; }
  const prevKey = route && route.key;
  route = r;
  document.documentElement.dataset.route = r.name;
  document.getElementById('reset').hidden = !(Object.keys(state.approved).length || Object.keys(state.calls).length);
  updateAgentBtn();

  if (r.name === 'approved') {
    closeSheet({ instant: true, returnFocus: false });
    hideBubble(false);
    agent.hidden = true;
    main.innerHTML = renderApproved(r.id);
    mainView = 'approved';
    document.title = 'Approved | WorkHero concept';
    startTick(r.id);
    window.scrollTo(0, 0);
    if (!state.first) main.querySelector('h1').focus({ preventScroll: true });
    state.first = false;
    return;
  }

  agent.hidden = false;
  const rebuilt = mainView !== 'week' || dirty;
  if (rebuilt) {
    const wasFirst = state.first;
    main.innerHTML = renderWeek();
    mainView = 'week';
    dirty = false;
    fitXLabels();
    plotWatch?.disconnect();
    plotWatch?.observe(document.getElementById('plot'));
    if (wasFirst) { runCountUp(); scheduleNudge(); }
    window.scrollTo(0, wasFirst ? 0 : weekScroll);
  }
  state.first = false;

  if (r.name === 'update') {
    cameFromWeek = prevKey === '#/';
    document.title = 'Update from your office manager | WorkHero concept';
    openSheet();
    if (state.focusItem || state.undoneFocus) {
      const id = state.focusItem || state.undoneFocus;
      state.focusItem = state.undoneFocus = null;
      const btn = sheet.querySelector(`[data-card="${id}"] [data-approve]`);
      if (btn) { btn.scrollIntoView({ block: 'center' }); btn.focus({ preventScroll: true }); }
    }
    return;
  }

  document.title = 'Your week with WorkHero';
  const wasOpen = sheet.open;
  if (wasOpen) closeSheet();
  maybeCaughtUp();
  if (state.undoneFocus) {
    const el = main.querySelector(`[data-approve="${state.undoneFocus}"]`);
    state.undoneFocus = null;
    if (el) { el.scrollIntoView({ block: 'center' }); el.focus({ preventScroll: true }); return; }
  }
  if (!wasOpen && rebuilt && prevKey) main.querySelector('h1').focus({ preventScroll: true });
}
function scheduleNudge() {
  if (state.later || state.nudgeDone) return;
  setTimeout(() => {
    if (state.nudgeDone || state.later || route.name !== 'week' || !derive().open.length) return;
    state.nudgeDone = true;
    if (window.scrollY <= DATA.bubble.hideAfterScroll) showBubble('nudge');
  }, DATA.bubble.delayMs);
}
function maybeCaughtUp() {
  if (derive().open.length) { if (noteEl()?.dataset.kind === 'caught') hideBubble(false); return; }
  if (state.caughtShown) return;
  state.caughtShown = true;
  setTimeout(() => { if (route.name === 'week') showBubble('caught'); }, 500);
}
function startTick(id) {
  tick = setInterval(() => {
    const a = state.approved[id];
    if (!a) return clearInterval(tick);
    const left = Math.ceil((a.until - Date.now()) / 1000);
    const el = document.getElementById('undo-left');
    if (el && left > 0) el.textContent = left + 's';
    if (left <= 0) {
      clearInterval(tick);
      const hadFocus = document.activeElement?.dataset?.undo;
      document.getElementById('undo-slot').innerHTML = undoHTML(id);
      if (hadFocus) main.querySelector('h1').focus({ preventScroll: true });
      announce(`Undo time is over. Text ${DATA.manager.first} if you need a change.`);
    }
  }, 250);
}

/* ---------- Actions ---------- */
function approve(id) {
  const n = DATA.needs.find(x => x.id === id);
  state.approved[id] = { until: Date.now() + DATA.undoSeconds * 1000, from: route.name === 'week' ? '#/' : '#/update' };
  state.nudgeDone = true;
  dirty = true;
  location.hash = '#/approved/' + id;
  announce(`Approved: ${n.title}. ${n.hearBack} You can undo for ${DATA.undoSeconds} seconds.`);
}
function undo(id) {
  const n = DATA.needs.find(x => x.id === id);
  const back = state.approved[id]?.from || '#/update';
  delete state.approved[id];
  dirty = true;
  state.undoneFocus = id;
  location.replace(back);
  announce(`Undone. The ${n.title.toLowerCase()} still needs your okay.`);
}
function askCall(id) {
  state.calls[id] = true;
  dirty = true;
  if (sheet.open) {
    sheet.innerHTML = renderThread();
    sheet.querySelector(`[data-card="${id}"] [data-approve]`).focus();
  } else {
    render();
    main.querySelector(`[data-card="${id}"] [data-approve]`).focus({ preventScroll: true });
  }
  announce(DATA.callNote);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.id === 'skip') { e.preventDefault(); main.focus(); main.scrollIntoView(); return; }
  if (t.id === 'agent-btn' || t.id === 'bubble-review') { location.hash = '#/update'; return; }
  if (t.id === 'bubble-later') {
    state.later = true;
    state.nudgeDone = true;
    store.set('wh-later', '1');
    hideBubble();
    announce('Okay. Dana’s update is here when you want it.');
    return;
  }
  if (t.id === 'sheet-close') { leaveSheet(); return; }
  if (t.id === 'reset') {
    state.approved = {}; state.calls = {}; state.later = false; state.nudgeDone = false; state.caughtShown = false;
    store.del('wh-later');
    dirty = true;
    if (location.hash === '#/' || !location.hash) render(); else location.hash = '#/';
    scheduleNudge();
    announce(`Sample reset. ${DATA.needs.length} items need you again.`);
    return;
  }
  if (t.dataset.approve) return approve(t.dataset.approve);
  if (t.dataset.call) return askCall(t.dataset.call);
  if (t.dataset.undo) return undo(t.dataset.undo);
  if (t.dataset.jumpCard) {
    const btn = sheet.querySelector(`[data-card="${t.dataset.jumpCard}"] [data-approve]`);
    btn.closest('[data-card]').scrollIntoView({ block: 'center' });
    btn.focus({ preventScroll: true });
    return;
  }
  if (t.dataset.focusItem) state.focusItem = t.dataset.focusItem;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.open) hideBubble(); });
sheet.addEventListener('cancel', e => { e.preventDefault(); leaveSheet(); });
sheet.addEventListener('close', () => {
  document.documentElement.classList.remove('sheet-open');
  // Only a close the app didn't start (a second Escape, say) needs the route corrected.
  if (!sheet.open && !ownClose && parse().name === 'update') location.replace('#/');
  ownClose = false;
});
sheet.addEventListener('click', e => { if (e.target === sheet) leaveSheet(); });
window.addEventListener('scroll', () => {
  if (mainView === 'week' && !sheet.open) weekScroll = window.scrollY;
  if (window.scrollY > DATA.bubble.hideAfterScroll) hideBubble();
}, { passive: true });
window.addEventListener('resize', fitXLabels, { passive: true });
window.addEventListener('hashchange', render);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
document.fonts?.ready.then(fitXLabels);

render();
</script>
</body>
</html>
